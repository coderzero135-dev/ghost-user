{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-24">
    <div class="bg-white/[0.03] border border-white/[0.06] rounded-2xl p-8">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-primary-500/10 flex items-center justify-center mx-auto mb-5">
                <span class="text-2xl">👻</span>
            </div>
            <h1 class="text-2xl font-bold mb-2 tracking-tight">Welcome back</h1>
            <p class="text-gray-400 text-sm">Log in to your Ghost User account</p>
        </div>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="text-sm font-medium text-gray-300 block mb-1.5">Email</label>
                <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" class="w-full px-4 py-3 bg-white/[0.04] border border-white/[0.08] rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 transition-all text-sm">
            </div>
            <div>
                <label class="text-sm font-medium text-gray-300 block mb-1.5">Password</label>
                <input type="password" id="password" required minlength="6" autocomplete="current-password" placeholder="••••••" class="w-full px-4 py-3 bg-white/[0.04] border border-white/[0.08] rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 transition-all text-sm">
            </div>
            <button type="submit" class="w-full py-3 bg-primary-600 hover:bg-primary-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-primary-600/20 hover:shadow-primary-500/30 active:scale-[0.98]">Log In</button>
            <p id="login-error" class="text-red-400 text-sm text-center hidden"></p>
        </form>
        <p class="text-center text-sm text-gray-500 mt-6">Don't have an account? <a href="/signup" class="text-primary-400 hover:text-primary-300 font-medium transition-colors">Sign up</a></p>
    </div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const err = document.getElementById('login-error');
    err.classList.add('hidden');
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.detail || 'Invalid credentials'; err.classList.remove('hidden'); return; }
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/dashboard';
    } catch(e) { err.textContent = 'Connection error'; err.classList.remove('hidden'); }
});
</script>
{% endblock %}
