{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold">Dashboard</h1>
        <a href="/" class="bg-ghost-600 hover:bg-ghost-500 px-5 py-2.5 rounded-xl text-sm font-medium transition-all">+ New Test</a>
    </div>
    <div id="tests-container" class="space-y-4">
        <div class="text-center py-20 text-gray-500">
            <div class="text-4xl mb-4">👻</div>
            <p class="text-lg">Loading your tests...</p>
        </div>
    </div>
</div>

<script>
async function loadDashboard() {
    const container = document.getElementById('tests-container');
    const token = localStorage.getItem('token');
    try {
        const res = await fetch('/api/tests', {
            headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        if (res.status === 401) { window.location.href = '/login'; return; }
        const tests = await res.json();
        if (tests.length === 0) {
            container.innerHTML = `
                <div class="text-center py-20 text-gray-500">
                    <div class="text-4xl mb-4">🔍</div>
                    <p class="text-lg mb-2">No tests yet</p>
                    <p class="text-sm text-gray-600">Run your first test to see results here</p>
                </div>`;
            return;
        }
        container.innerHTML = tests.map(t => {
            const statusColors = { pending: 'text-yellow-400', queued: 'text-blue-400', running: 'text-purple-400', completed: 'text-green-400', failed: 'text-red-400' };
            return `
            <a href="/test/${t.id}" class="block bg-gray-900/50 border border-gray-800 rounded-xl p-5 hover:border-gray-700 transition-all">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <span class="text-2xl">🌐</span>
                        <div>
                            <p class="font-medium">${t.url}</p>
                            <p class="text-sm text-gray-500">${new Date(t.created_at).toLocaleString()}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="text-sm ${statusColors[t.status] || 'text-gray-400'} capitalize">${t.status}</span>
                        <span class="text-gray-600">→</span>
                    </div>
                </div>
            </a>`;
        }).join('');
    } catch (err) {
        container.innerHTML = `<div class="text-center py-20 text-red-400">Failed to load tests: ${err.message}</div>`;
    }
}
loadDashboard();
</script>
{% endblock %}
