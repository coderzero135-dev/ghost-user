{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-20">

<div id="needs-login" class="text-center py-12 hidden">
    <div class="w-14 h-14 rounded-2xl bg-primary-500/10 flex items-center justify-center mx-auto mb-4"><span class="text-xl">🔒</span></div>
    <h2 class="text-xl font-bold mb-2">Login required</h2>
    <p class="text-gray-400 text-sm mb-6">You need an account to upgrade</p>
    <a href="/login" class="px-6 py-2.5 bg-primary-600 hover:bg-primary-500 text-white font-semibold rounded-xl transition-all">Log In</a>
    <a href="/signup" class="block text-primary-400 text-sm mt-3">or create account</a>
</div>

<div id="checkout-ui" class="hidden">
    <div class="bg-white/[0.03] border border-white/[0.06] rounded-2xl p-8">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-primary-500/10 flex items-center justify-center mx-auto mb-4"><span class="text-xl">💳</span></div>
            <h1 class="text-2xl font-bold" id="plan-name">Pro</h1>
        </div>

        <div class="bg-white/[0.04] rounded-xl p-5 mb-6">
            <div class="flex justify-between items-center mb-3"><span class="text-gray-400">Plan</span><span class="font-semibold" id="label-plan">Pro</span></div>
            <div class="flex justify-between items-center mb-3"><span class="text-gray-400">Billing</span><span class="font-semibold">Monthly</span></div>
            <div class="border-t border-white/[0.06] pt-3 mt-3 flex justify-between items-center"><span class="font-semibold">Total</span><span class="text-xl font-bold text-primary-400" id="label-price">₹999</span></div>
        </div>

        <ul class="space-y-2 mb-6 text-sm text-gray-400" id="features-list"></ul>

        <button onclick="pay()" id="pay-btn" class="w-full py-3.5 bg-primary-600 hover:bg-primary-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-primary-600/20">Pay with Razorpay</button>
        <button onclick="activateDirect()" class="w-full py-3 mt-3 border border-white/10 hover:border-primary-500/50 text-white font-semibold rounded-xl transition-all text-sm">Activate Instantly (skip payment)</button>
        <p id="status-msg" class="text-xs text-gray-600 text-center mt-4">Secured by Razorpay · Test card: 4111 1111 1111 1111</p>
    </div>
</div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const params = new URLSearchParams(location.search);
const plan = params.get('plan') || 'pro';
const token = localStorage.getItem('token');

const plans = {
    pro:    { name:'Pro', amount:99900, credits:30, price:'₹999',     features:['30 tests/month','Full UX breakdown','Session replays','Priority support'] },
    agency: { name:'Agency',amount:499900,credits:999,price:'₹4,999', features:['Unlimited tests','White-label reports','API access','Custom personas'] }
};
const p = plans[plan] || plans.pro;

if (!token) {
    document.getElementById('needs-login').classList.remove('hidden');
} else {
    document.getElementById('checkout-ui').classList.remove('hidden');
    document.getElementById('plan-name').textContent = 'Upgrade to ' + p.name;
    document.getElementById('label-plan').textContent = p.name;
    document.getElementById('label-price').textContent = p.price;
    document.getElementById('features-list').innerHTML = p.features.map(f => `<li class="flex items-center gap-2"><svg class="w-4 h-4 text-primary-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>${f}</li>`).join('');
}

async function pay() {
    const btn = document.getElementById('pay-btn');
    const msg = document.getElementById('status-msg');
    btn.textContent = 'Creating order...';
    btn.disabled = true;

    try {
        const oRes = await fetch('/api/payment/create-order', {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
            body: JSON.stringify({ plan })
        });
        const order = await oRes.json();
        if (!oRes.ok) throw new Error(order.detail || 'Order failed');

        const rzp = new Razorpay({
            key: order.key_id,
            amount: order.amount,
            currency: 'INR',
            name: 'nipX',
            description: p.name + ' Plan',
            order_id: order.order_id,
            prefill: { email: order.prefill_email },
            theme: { color: '#6366f1' },
            handler: async function(r) {
                btn.textContent = 'Verifying...';
                const vRes = await fetch('/api/payment/verify', {
                    method:'POST',
                    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
                    body: JSON.stringify({ razorpay_order_id: r.razorpay_order_id, razorpay_payment_id: r.razorpay_payment_id, razorpay_signature: r.razorpay_signature, plan })
                });
                if (vRes.ok) {
                    const user = JSON.parse(localStorage.getItem('user')||'{}');
                    user.credits = p.credits;
                    user.plan = plan;
                    localStorage.setItem('user', JSON.stringify(user));
                    window.location.href = '/dashboard?upgraded=' + plan;
                } else {
                    msg.textContent = 'Verification failed. Please try again.';
                    btn.textContent = 'Pay with Razorpay';
                    btn.disabled = false;
                }
            },
            modal: { ondismiss: () => { btn.textContent = 'Pay with Razorpay'; btn.disabled = false; } }
        });
        rzp.open();
    } catch(e) {
        msg.textContent = e.message || 'Payment error';
        btn.textContent = 'Pay with Razorpay';
        btn.disabled = false;
    }
}

async function activateDirect() {
    try {
        const res = await fetch('/api/auth/upgrade', {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
            body: JSON.stringify({ plan, credits: p.credits })
        });
        if (res.ok) {
            const user = JSON.parse(localStorage.getItem('user')||'{}');
            user.credits = p.credits;
            user.plan = plan;
            localStorage.setItem('user', JSON.stringify(user));
            window.location.href = '/dashboard?upgraded=' + plan;
        } else {
            alert('Activation failed');
        }
    } catch(e) { alert('Error'); }
}
</script>
{% endblock %}
