<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> nipX — Test Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', system-ui, sans-serif; }
        body { background: #fff; color: #111827; }
        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            @page { margin: 15mm; }
        }
    </style>
</head>
<body class="max-w-4xl mx-auto px-6 py-10">
    <div id="report-content">
        <div id="loading" class="text-center py-20 text-gray-400">Loading report...</div>
    </div>

    <div class="no-print text-center mt-10 pt-6 border-t border-gray-200 flex items-center justify-center gap-4">
        <button onclick="window.print()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/20 transition-all">Download PDF</button>
        <a href="/" class="text-sm text-gray-400 hover:text-gray-600">Back to nipX</a>
    </div>

    <script>
    const id = new URLSearchParams(window.location.search).get('id');
    const token = localStorage.getItem('token');
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;

    const labels = { first_time_customer:'First-Time Visitor', confused_grandparent:'Elderly Beginner', power_user:'Power User', impatient_gamer:'Speed Runner', mobile_user:'Phone User', potential_buyer:'Cautious Buyer' };
    const emojis = { first_time_customer:'🆕', confused_grandparent:'👴', power_user:'⚡', impatient_gamer:'🎮', mobile_user:'📱', potential_buyer:'💰' };

    function scoreColor(s) { if (s >= 80) return '#059669'; if (s >= 60) return '#d97706'; if (s >= 40) return '#ea580c'; return '#dc2626'; }
    function scoreBg(s) { if (s >= 80) return '#ecfdf5'; if (s >= 60) return '#fffbeb'; if (s >= 40) return '#fff7ed'; return '#fef2f2'; }
    function sevColor(s) { return {critical:'#dc2626',high:'#ea580c',medium:'#d97706',low:'#2563eb'}[s] || '#6b7280'; }

    async function load() {
        const res = await fetch(`/api/tests/${id}`, { headers });
        const d = await res.json();
        const s = d.ux_score || { overall_score: '--', summary: 'No score available' };

        let html = `
        <div class="flex items-center justify-between mb-8 pb-6 border-b border-gray-200">
            <div>
                <h1 class="text-2xl font-black tracking-tight">
                    <span class="text-indigo-600">nip</span><span class="text-gray-900">X</span>
                </h1>
                <p class="text-xs text-gray-500 mt-0.5">UX Test Report</p>
            </div>
            <div class="text-right text-xs text-gray-500">
                <p>${new Date(d.created_at).toLocaleDateString('en-IN', {day:'numeric',month:'long',year:'numeric'})}</p>
                <p>${new Date(d.created_at).toLocaleTimeString()}</p>
            </div>
        </div>

        <div class="mb-10">
            <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">Website tested</h2>
            <p class="text-xl font-bold text-gray-900">${d.url}</p>
        </div>
        `;

        if (d.ux_score) {
            html += `
            <div class="mb-10 p-6 rounded-2xl" style="background:${scoreBg(d.ux_score.overall_score)}; border:1px solid ${scoreColor(d.ux_score.overall_score)}20">
                <div class="flex items-center gap-6 mb-4">
                    <div class="text-center">
                        <div class="text-4xl font-black" style="color:${scoreColor(d.ux_score.overall_score)}">${Math.round(d.ux_score.overall_score)}</div>
                        <div class="text-xs text-gray-500">/ 100</div>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-lg mb-1">UX Score</h3>
                        <p class="text-sm text-gray-600">${d.ux_score.summary}</p>
                    </div>
                </div>
                <div class="grid grid-cols-5 gap-2 text-center">
                    ${['navigation','clarity','speed','mobile','content'].map(c => `
                        <div class="bg-white/60 rounded-lg p-2">
                            <div class="text-lg font-bold" style="color:${scoreColor(d.ux_score[c+'_score'])}">${Math.round(d.ux_score[c+'_score'])}</div>
                            <div class="text-[10px] text-gray-500 capitalize">${c}</div>
                        </div>`).join('')}
                </div>
            </div>`;

            const b = d.ux_score.breakdown || {};
            html += `<div class="grid grid-cols-3 gap-4 mb-10">`;
            if (b.strengths?.length) html += `<div><h4 class="text-sm font-semibold text-green-700 mb-2">✅ Strengths</h4><ul class="space-y-1">${b.strengths.slice(0,5).map(s=>`<li class="text-sm text-gray-600 flex gap-1"><span>•</span> <span>${s}</span></li>`).join('')}</ul></div>`;
            if (b.weaknesses?.length) html += `<div><h4 class="text-sm font-semibold text-red-700 mb-2">⚠️ Issues Found</h4><ul class="space-y-1">${b.weaknesses.slice(0,5).map(s=>`<li class="text-sm text-gray-600 flex gap-1"><span>•</span> <span>${s}</span></li>`).join('')}</ul></div>`;
            if (b.recommendations?.length) html += `<div><h4 class="text-sm font-semibold text-indigo-700 mb-2">💡 Recommendations</h4><ul class="space-y-1">${b.recommendations.slice(0,5).map(s=>`<li class="text-sm text-gray-600 flex gap-1"><span>•</span> <span>${s}</span></li>`).join('')}</ul></div>`;
            html += `</div>`;
        }

        html += `<h3 class="text-lg font-bold mb-3">Persona Results</h3><div class="grid grid-cols-2 gap-3 mb-10">`;
        (d.persona_results || []).forEach(p => {
            const sc = p.screenshot_paths || [];
            html += `
            <div class="border border-gray-200 rounded-xl p-4">
                <div class="flex items-center gap-2 mb-2">
                    <span class="text-lg">${emojis[p.persona_name] || '👤'}</span>
                    <span class="font-semibold text-sm">${labels[p.persona_name] || p.persona_name}</span>
                    <span class="text-xs ml-auto px-2 py-0.5 rounded-full ${p.status==='completed'?'bg-green-100 text-green-700':'bg-red-100 text-red-700'} capitalize">${p.status}</span>
                </div>
                <p class="text-xs text-gray-500">${sc.length} screenshots • ${(p.navigation_path||[]).length} actions • ${(p.issues_found||[]).length} issues</p>
            </div>`;
        });
        html += `</div>`;

        if (d.issues?.length) {
            html += `<h3 class="text-lg font-bold mb-3">Issues (${d.issues.length})</h3><div class="space-y-2 mb-10">`;
            d.issues.forEach(i => {
                html += `
                <div class="flex items-start gap-3 border border-gray-200 rounded-lg p-3">
                    <span class="px-2 py-0.5 rounded text-xs font-bold text-white shrink-0" style="background:${sevColor(i.severity)}">${i.severity.toUpperCase()}</span>
                    <div>
                        <p class="text-sm font-medium">${i.description}</p>
                        <p class="text-xs text-gray-500 mt-0.5">${labels[i.persona_name] || i.persona_name} • ${i.type?.replace(/_/g,' ')}</p>
                    </div>
                </div>`;
            });
            html += `</div>`;
        }

        html += `
        <div class="text-center text-[10px] text-gray-400 pt-6 border-t border-gray-200">
            Generated by nipX — AI-powered UX testing
        </div>`;

        document.getElementById('report-content').innerHTML = html;
        if (new URLSearchParams(window.location.search).get('print') === '1') setTimeout(window.print, 500);
    }

    load();
    </script>
</body>
</html>
