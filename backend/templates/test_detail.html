{% extends "base.html" %}
{% block title %}Test Results{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div id="test-detail" class="space-y-8">
        <div class="text-center py-20 text-gray-500">
            <div class="animate-spin text-4xl mb-4 inline-block">⏳</div>
            <p class="text-lg">Loading test results...</p>
        </div>
    </div>
</div>

<script>
const testId = {{ test_id }};

function getSeverityColor(s) {
    const map = { critical: 'text-red-400 bg-red-900/30 border-red-800', high: 'text-orange-400 bg-orange-900/30 border-orange-800', medium: 'text-yellow-400 bg-yellow-900/30 border-yellow-800', low: 'text-blue-400 bg-blue-900/30 border-blue-800' };
    return map[s] || map.medium;
}

function getScoreColor(s) {
    if (s >= 80) return 'text-green-400';
    if (s >= 60) return 'text-yellow-400';
    if (s >= 40) return 'text-orange-400';
    return 'text-red-400';
}

function renderScoreGauge(score) {
    const r = 54;
    const circ = 2 * Math.PI * r;
    const offset = circ - (score / 100) * circ;
    const color = score >= 80 ? '#22c55e' : score >= 60 ? '#eab308' : score >= 40 ? '#f97316' : '#ef4444';
    return `
    <div class="flex flex-col items-center">
        <svg width="140" height="140" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="${r}" fill="none" stroke="#1f2937" stroke-width="10"/>
            <circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round" transform="rotate(-90 70 70)"/>
            <text x="70" y="70" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="bold" fill="${color}">${Math.round(score)}</text>
        </svg>
        <span class="text-sm text-gray-500 mt-1">UX Score</span>
    </div>`;
}

function renderPersonaCard(p) {
    const emojiMap = { first_time_customer: '🆕', confused_grandparent: '👴', power_user: '⚡', impatient_gamer: '🎮', mobile_user: '📱', potential_buyer: '💰' };
    const labelMap = { first_time_customer: 'First-Time Customer', confused_grandparent: 'Confused Grandparent', power_user: 'Power User', impatient_gamer: 'Impatient Gamer', mobile_user: 'Mobile User', potential_buyer: 'Potential Buyer' };
    const statusIcon = p.status === 'completed' ? '✅' : p.status === 'failed' ? '❌' : p.status === 'running' ? '⏳' : '⏳';
    const screenshots = p.screenshot_paths || [];

    return `
    <div class="bg-gray-900/50 border border-gray-800 rounded-xl p-5">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">${emojiMap[p.persona_name] || '👤'}</span>
                <div>
                    <h3 class="font-semibold">${labelMap[p.persona_name] || p.persona_name}</h3>
                    <p class="text-xs text-gray-500 capitalize">Status: ${p.status}</p>
                </div>
            </div>
            <span>${statusIcon}</span>
        </div>
        ${p.video_path ? `<div class="mb-3"><video controls class="w-full rounded-lg max-h-64 bg-black"><source src="/${p.video_path}" type="video/webm"></video></div>` : ''}
        ${screenshots.length > 0 ? `
        <details>
            <summary class="text-sm text-ghost-400 cursor-pointer mb-2">Screenshots (${screenshots.length})</summary>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-2">
                ${screenshots.map(s => `<a href="/${s}" target="_blank"><img src="/${s}" class="rounded-lg border border-gray-700 hover:border-ghost-500 transition-all w-full"></a>`).join('')}
            </div>
        </details>` : ''}
        ${p.navigation_path && p.navigation_path.length > 0 ? `
        <details class="mt-2">
            <summary class="text-sm text-ghost-400 cursor-pointer">Navigation (${p.navigation_path.length} steps)</summary>
            <div class="mt-2 space-y-1 max-h-48 overflow-y-auto text-xs text-gray-400">
                ${p.navigation_path.map((n, i) => `<div class="flex items-start space-x-2"><span class="text-gray-600">${i+1}.</span><span>${n.action} ${n.url ? n.url : ''} ${n.selector ? n.selector : ''}</span></div>`).join('')}
            </div>
        </details>` : ''}
    </div>`;
}

function renderIssueRow(i) {
    const personaLabel = {
        first_time_customer: 'First-Time Customer', confused_grandparent: 'Confused Grandparent',
        power_user: 'Power User', impatient_gamer: 'Impatient Gamer',
        mobile_user: 'Mobile User', potential_buyer: 'Potential Buyer'
    }[i.persona_name] || i.persona_name.replace(/_/g, ' ');
    return `
    <div class="flex items-start space-x-3 px-5 py-3">
        <span class="px-2 py-0.5 rounded text-xs font-medium border ${getSeverityColor(i.severity)} capitalize shrink-0">${i.severity}</span>
        <div class="flex-1 min-w-0">
            <p class="text-sm">${i.description}</p>
            <p class="text-xs text-gray-500 mt-0.5">${personaLabel}</p>
        </div>
    </div>`;
}

async function loadTest() {
    const container = document.getElementById('test-detail');
    const token = localStorage.getItem('token');
    try {
        const res = await fetch(`/api/tests/${testId}`, {
            headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        const data = await res.json();

        if (data.status === 'queued' || data.status === 'pending' || data.status === 'running') {
            container.innerHTML = `
                <div class="text-center py-20">
                    <div class="animate-spin text-5xl mb-6 inline-block">⏳</div>
                    <h2 class="text-2xl font-bold mb-2">Testing ${data.url}</h2>
                    <p class="text-gray-400">6 AI personas are exploring your site...</p>
                    <div class="max-w-md mx-auto mt-8 space-y-2">
                        ${['first_time_customer', 'confused_grandparent', 'power_user', 'impatient_gamer', 'mobile_user', 'potential_buyer'].map(p => {
                            const pr = (data.persona_results || []).find(r => r.persona_name === p);
                            const status = pr ? pr.status : 'pending';
                            const icons = { completed: '✅', running: '⏳', pending: '⬜', failed: '❌' };
                            const labels = { first_time_customer: 'First-Time Customer', confused_grandparent: 'Confused Grandparent', power_user: 'Power User', impatient_gamer: 'Impatient Gamer', mobile_user: 'Mobile User', potential_buyer: 'Potential Buyer' };
                            return `<div class="flex items-center justify-between bg-gray-900/50 rounded-lg px-4 py-2"><span>${icons[status] || '⬜'} ${labels[p]}</span><span class="text-xs text-gray-500 capitalize">${status}</span></div>`;
                        }).join('')}
                    </div>
                </div>`;
            setTimeout(loadTest, 3000);
            return;
        }

        let html = '';

        if (data.ux_score) {
            html += `
            <div class="bg-gray-900/50 border border-gray-800 rounded-2xl p-8">
                <div class="flex flex-col lg:flex-row items-center gap-8">
                    ${renderScoreGauge(data.ux_score.overall_score)}
                    <div class="flex-1">
                        <h2 class="text-xl font-bold mb-2">${data.url}</h2>
                        <p class="text-gray-400 text-sm mb-4">${data.ux_score.summary}</p>
                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                            ${['navigation', 'clarity', 'speed', 'mobile', 'content'].map(c => `
                                <div class="text-center bg-gray-800/50 rounded-lg p-3">
                                    <div class="text-lg font-bold ${getScoreColor(data.ux_score[`${c}_score`])}">${Math.round(data.ux_score[`${c}_score`])}</div>
                                    <div class="text-xs text-gray-500 capitalize">${c}</div>
                                </div>`).join('')}
                        </div>
                        ${data.ux_score.breakdown ? `
                        <div class="mt-4 grid md:grid-cols-3 gap-4 text-sm">
                            ${data.ux_score.breakdown.strengths && data.ux_score.breakdown.strengths.length ? `<div><h4 class="text-green-400 font-medium mb-1">✅ Strengths</h4><ul class="text-gray-400 space-y-1">${data.ux_score.breakdown.strengths.slice(0,3).map(s => `<li>• ${s}</li>`).join('')}</ul></div>` : ''}
                            ${data.ux_score.breakdown.weaknesses && data.ux_score.breakdown.weaknesses.length ? `<div><h4 class="text-red-400 font-medium mb-1">⚠️ Issues</h4><ul class="text-gray-400 space-y-1">${data.ux_score.breakdown.weaknesses.slice(0,3).map(s => `<li>• ${s}</li>`).join('')}</ul></div>` : ''}
                            ${data.ux_score.breakdown.recommendations && data.ux_score.breakdown.recommendations.length ? `<div><h4 class="text-ghost-400 font-medium mb-1">💡 Fixes</h4><ul class="text-gray-400 space-y-1">${data.ux_score.breakdown.recommendations.slice(0,3).map(s => `<li>• ${s}</li>`).join('')}</ul></div>` : ''}
                        </div>` : ''}
                    </div>
                </div>
            </div>`;
        } else {
            html += `
            <div class="bg-gray-900/50 border border-gray-800 rounded-2xl p-8 text-center">
                <h2 class="text-xl font-bold mb-2">${data.url}</h2>
                <p class="text-gray-400">Status: <span class="capitalize">${data.status}</span></p>
            </div>`;
        }

        html += `
        <div>
            <h3 class="text-lg font-semibold mb-4">Persona Results</h3>
            <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                ${(data.persona_results || []).map(renderPersonaCard).join('')}
            </div>
        </div>`;

        if (data.issues && data.issues.length > 0) {
            const groups = {};
            const groupLabels = {
                missing_element: { icon: '🔗', title: 'Missing Links & Buttons', desc: 'Personas looked for navigation links or buttons that were not found' },
                navigation_error: { icon: '🚦', title: 'Navigation Problems', desc: 'Pages that failed to load or actions that timed out' },
                click_error: { icon: '🖱️', title: 'Click Issues', desc: 'Elements that were difficult or confusing to interact with' },
                fatal: { icon: '💥', title: 'Critical Errors', desc: 'Serious failures that prevented testing' },
            };
            data.issues.forEach(i => {
                const g = groups[i.type] || (groups[i.type] = []);
                g.push(i);
            });
            html += `<div><h3 class="text-lg font-semibold mb-4">Issues Found (${data.issues.length})</h3><div class="space-y-4">`;
            for (const [type, items] of Object.entries(groups)) {
                const meta = groupLabels[type] || { icon: '⚠️', title: type.replace(/_/g, ' '), desc: '' };
                html += `
                <div class="bg-gray-900/50 border border-gray-800 rounded-xl overflow-hidden">
                    <div class="px-5 py-3 border-b border-gray-800 flex items-center space-x-3">
                        <span class="text-lg">${meta.icon}</span>
                        <div>
                            <h4 class="font-semibold text-sm">${meta.title} (${items.length})</h4>
                            ${meta.desc ? `<p class="text-xs text-gray-500">${meta.desc}</p>` : ''}
                        </div>
                    </div>
                    <div class="divide-y divide-gray-800/50">
                        ${items.map(renderIssueRow).join('')}
                    </div>
                </div>`;
            }
            html += `</div></div>`;
        }

        html += `<div class="text-center pt-4"><a href="/dashboard" class="text-ghost-400 hover:text-ghost-300 text-sm">← Back to Dashboard</a></div>`;
        container.innerHTML = html;

    } catch (err) {
        container.innerHTML = `<div class="text-center py-20 text-red-400">Failed to load: ${err.message}</div>`;
    }
}

loadTest();
</script>
{% endblock %}
