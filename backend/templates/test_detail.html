{% extends "base.html" %}
{% block title %}Test Results{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div id="test-detail" class="space-y-8">
        <div class="text-center py-20 text-gray-500">
            <div class="animate-spin text-4xl mb-4 inline-block">⏳</div>
            <p class="text-lg">Loading test results...</p>
        </div>
    </div>
</div>

<script>
const testId = {{ test_id }};

function getSeverityColor(s) {
    const map = { critical: 'text-red-400 bg-red-900/30 border-red-800', high: 'text-orange-400 bg-orange-900/30 border-orange-800', medium: 'text-yellow-400 bg-yellow-900/30 border-yellow-800', low: 'text-blue-400 bg-blue-900/30 border-blue-800' };
    return map[s] || map.medium;
}

function getScoreColor(s) {
    if (s >= 80) return 'text-green-400';
    if (s >= 60) return 'text-yellow-400';
    if (s >= 40) return 'text-orange-400';
    return 'text-red-400';
}

function renderScoreGauge(score) {
    const r = 54;
    const circ = 2 * Math.PI * r;
    const offset = circ - (score / 100) * circ;
    const color = score >= 80 ? '#22c55e' : score >= 60 ? '#eab308' : score >= 40 ? '#f97316' : '#ef4444';
    return `
    <div class="flex flex-col items-center">
        <svg width="140" height="140" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="${r}" fill="none" stroke="#1f2937" stroke-width="10"/>
            <circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round" transform="rotate(-90 70 70)"/>
            <text x="70" y="70" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="bold" fill="${color}">${Math.round(score)}</text>
        </svg>
        <span class="text-sm text-gray-500 mt-1">UX Score</span>
    </div>`;
}

function renderPersonaCard(p) {
    const emojiMap = { first_time_customer: '🆕', confused_grandparent: '👴', power_user: '⚡', impatient_gamer: '🎮', mobile_user: '📱', potential_buyer: '💰' };
    const labelMap = { first_time_customer: 'First-Time Customer', confused_grandparent: 'Confused Grandparent', power_user: 'Power User', impatient_gamer: 'Impatient Gamer', mobile_user: 'Mobile User', potential_buyer: 'Potential Buyer' };
    const statusIcon = p.status === 'completed' ? '✅' : p.status === 'failed' ? '❌' : p.status === 'running' ? '⏳' : '⏳';
    const screenshots = p.screenshot_paths || [];

    return `
    <div class="bg-gray-900/50 border border-gray-800 rounded-xl p-5">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">${emojiMap[p.persona_name] || '👤'}</span>
                <div>
                    <h3 class="font-semibold">${labelMap[p.persona_name] || p.persona_name}</h3>
                    <p class="text-xs text-gray-500 capitalize">Status: ${p.status}</p>
                </div>
            </div>
            <span>${statusIcon}</span>
        </div>
        ${p.video_path ? `<div class="mb-3"><video controls class="w-full rounded-lg max-h-64 bg-black"><source src="/${p.video_path}" type="video/webm"></video></div>` : ''}
        ${screenshots.length > 0 ? `
        <details>
            <summary class="text-sm text-primary-400 cursor-pointer mb-2">Screenshots (${screenshots.length})</summary>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-2">
                ${screenshots.map(s => `<img src="/${s}" onclick="openLightbox('/${s}')" class="rounded-lg border border-gray-700 hover:border-primary-500 transition-all w-full cursor-pointer">`).join('')}
            </div>
        </details>` : ''}
        ${p.navigation_path && p.navigation_path.length > 0 ? `
        <details class="mt-2">
            <summary class="text-sm text-primary-400 cursor-pointer">Navigation (${p.navigation_path.length} steps)</summary>
            <div class="mt-2 space-y-1 max-h-48 overflow-y-auto text-xs text-gray-400">
                ${p.navigation_path.map((n, i) => `<div class="flex items-start space-x-2"><span class="text-gray-600">${i+1}.</span><span>${n.action} ${n.url ? n.url : ''} ${n.selector ? n.selector : ''}</span></div>`).join('')}
            </div>
        </details>` : ''}
    </div>`;
}

function renderIssueRow(i) {
    const personaLabel = {
        first_time_customer: 'First-Time Customer', confused_grandparent: 'Confused Grandparent',
        power_user: 'Power User', impatient_gamer: 'Impatient Gamer',
        mobile_user: 'Mobile User', potential_buyer: 'Potential Buyer'
    }[i.persona_name] || i.persona_name.replace(/_/g, ' ');
    return `
    <div class="flex items-start space-x-3 px-5 py-3">
        <span class="px-2 py-0.5 rounded text-xs font-medium border ${getSeverityColor(i.severity)} capitalize shrink-0">${i.severity}</span>
        <div class="flex-1 min-w-0">
            <p class="text-sm">${i.description}</p>
            <p class="text-xs text-gray-500 mt-0.5">${personaLabel}</p>
        </div>
    </div>`;
}

async function loadTest() {
    const container = document.getElementById('test-detail');
    const token = localStorage.getItem('token');
    try {
        const res = await fetch(`/api/tests/${testId}`, {
            headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });
        const data = await res.json();

        if (data.status === 'queued' || data.status === 'pending' || data.status === 'running') {
            const [progRes, detailRes] = await Promise.all([
                fetch(`/api/tests/${testId}/progress`),
                fetch(`/api/tests/${testId}`)
            ]);
            const prog = await progRes.json();
            const detail = await detailRes.json();
            const done = prog.completed_personas || 0;
            const pct = Math.round((done / 6) * 100);
            const labels = { first_time_customer: 'First-Time Visitor', confused_grandparent: 'Elderly Beginner', power_user: 'Power User', impatient_gamer: 'Speed Runner', mobile_user: 'Phone User', potential_buyer: 'Cautious Buyer' };
            const emojis = { first_time_customer: '🧍', confused_grandparent: '🧑', power_user: '🧑‍💻', impatient_gamer: '🧑', mobile_user: '🤳', potential_buyer: '🧑' };

            container.innerHTML = `
                <div class="max-w-2xl mx-auto">
                    <div class="bg-white/[0.03] border border-white/[0.06] rounded-2xl p-8 mb-6">
                        <div class="text-center mb-6">
                            <h2 class="text-xl font-bold mb-1">Testing ${detail.url}</h2>
                            <p class="text-sm text-gray-400">${done}/6 personas completed</p>
                        </div>
                        <div class="w-full bg-white/[0.04] rounded-full h-2.5 mb-6 overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-primary-500 to-purple-500 rounded-full transition-all duration-700" style="width:${pct}%"></div>
                        </div>
                        <div class="space-y-2">
                            ${(prog.persona_progress || []).map(p => {
                                const done = p.status === 'completed';
                                const fail = p.status === 'failed';
                                const icon = done ? '✅' : fail ? '❌' : '<span class="animate-spin inline-block">⏳</span>';
                                return `
                                <div class="flex items-center gap-3 px-3 py-2 rounded-lg ${done ? 'bg-green-500/5' : fail ? 'bg-red-500/5' : 'bg-white/[0.02]'}">
                                    <span class="text-lg">${emojis[p.persona_name] || '👤'}</span>
                                    <span class="flex-1 text-sm">${labels[p.persona_name] || p.persona_name}</span>
                                    ${done ? `<span class="text-xs text-gray-500">${p.screenshots_count} screenshots</span>` : ''}
                                    <span>${icon}</span>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
            setTimeout(loadTest, 2000);
            return;
        }

        let html = '';

        if (data.ux_score) {
            html += `
            <div class="bg-gray-900/50 border border-gray-800 rounded-2xl p-8">
                <div class="flex flex-col lg:flex-row items-center gap-8">
                    ${renderScoreGauge(data.ux_score.overall_score)}
                    <div class="flex-1">
                        <h2 class="text-xl font-bold mb-2">${data.url}</h2>
                        <p class="text-gray-400 text-sm mb-4">${data.ux_score.summary}</p>
                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                            ${['navigation', 'clarity', 'speed', 'mobile', 'content'].map(c => `
                                <div class="text-center bg-gray-800/50 rounded-lg p-3">
                                    <div class="text-lg font-bold ${getScoreColor(data.ux_score[`${c}_score`])}">${Math.round(data.ux_score[`${c}_score`])}</div>
                                    <div class="text-xs text-gray-500 capitalize">${c}</div>
                                </div>`).join('')}
                        </div>
                        ${data.ux_score.breakdown ? `
                        <div class="mt-4 grid md:grid-cols-3 gap-4 text-sm">
                            ${data.ux_score.breakdown.strengths && data.ux_score.breakdown.strengths.length ? `<div><h4 class="text-green-400 font-medium mb-1">✅ Strengths</h4><ul class="text-gray-400 space-y-1">${data.ux_score.breakdown.strengths.slice(0,3).map(s => `<li>• ${s}</li>`).join('')}</ul></div>` : ''}
                            ${data.ux_score.breakdown.weaknesses && data.ux_score.breakdown.weaknesses.length ? `<div><h4 class="text-red-400 font-medium mb-1">⚠️ Issues</h4><ul class="text-gray-400 space-y-1">${data.ux_score.breakdown.weaknesses.slice(0,3).map(s => `<li>• ${s}</li>`).join('')}</ul></div>` : ''}
                            ${data.ux_score.breakdown.recommendations && data.ux_score.breakdown.recommendations.length ? `<div><h4 class="text-primary-400 font-medium mb-1">💡 Fixes</h4><ul class="text-gray-400 space-y-1">${data.ux_score.breakdown.recommendations.slice(0,3).map(s => `<li>• ${s}</li>`).join('')}</ul></div>` : ''}
                        </div>` : ''}
                    </div>
                </div>
            </div>`;
        } else {
            html += `
            <div class="bg-gray-900/50 border border-gray-800 rounded-2xl p-8 text-center">
                <h2 class="text-xl font-bold mb-2">${data.url}</h2>
                <p class="text-gray-400">Status: <span class="capitalize">${data.status}</span></p>
            </div>`;
        }

        const personaEmoji = { first_time_customer: '&#x1F195;', confused_grandparent: '&#x1F474;', power_user: '&#x26A1;', impatient_gamer: '&#x1F3AE;', mobile_user: '&#x1F4F1;', potential_buyer: '&#x1F4B0;' };
        const personaLabel = { first_time_customer: 'First-Time Visitor', confused_grandparent: 'Elderly Beginner', power_user: 'Power User', impatient_gamer: 'Speed Runner', mobile_user: 'Phone User', potential_buyer: 'Cautious Buyer' };

        html += '<div class="space-y-8">';
        (data.persona_results || []).forEach(p => {
            const pIssues = (data.issues || []).filter(i => i.persona_name === p.persona_name);
            const sc = p.screenshot_paths || [];
            const nav = p.navigation_path || [];
            const notes = p.persona_notes ? JSON.parse(p.persona_notes) : {};

            html += `
            <div class="bg-white/[0.03] border border-white/[0.06] rounded-2xl overflow-hidden">
                <div class="px-6 py-4 border-b border-white/[0.06] flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">${personaEmoji[p.persona_name] || '👤'}</span>
                        <div>
                            <h3 class="font-semibold">${personaLabel[p.persona_name] || p.persona_name}</h3>
                            <p class="text-xs text-gray-500">${nav.length} actions • ${sc.length} screenshots • ${pIssues.length} issues</p>
                        </div>
                    </div>
                    <span class="text-xs px-2 py-1 rounded-full capitalize ${p.status === 'completed' ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}">${p.status}</span>
                </div>
                <div class="p-6 space-y-4">`;

            if (notes.scroll_depth_pct) html += `<div class="flex items-center gap-2 text-xs text-gray-500"><span>Scrolled ${notes.scroll_depth_pct}% of the page</span></div>`;
            if (notes.console_errors) html += `<div class="text-xs text-red-400">${notes.console_errors} browser console errors detected</div>`;

            if (pIssues.length > 0) {
                html += `<div class="space-y-2"><h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Issues found</h4>`;
                pIssues.forEach(i => {
                    html += `
                    <div class="flex items-start gap-3 bg-white/[0.02] rounded-lg px-3 py-2">
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-bold border ${getSeverityColor(i.severity)} capitalize shrink-0">${i.severity}</span>
                        <p class="text-sm">${i.description}</p>
                    </div>`;
                });
                html += `</div>`;
            } else {
                html += `<div class="text-xs text-green-400">No issues found — smooth experience</div>`;
            }

            if (sc.length > 0) {
                html += `
                <details><summary class="text-sm text-primary-400 cursor-pointer">View ${sc.length} screenshots</summary>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-3">${sc.map(s => `<img src="/${s}" onclick="openLightbox('/${s}')" class="rounded-lg border border-gray-700 hover:border-primary-500 transition-all w-full cursor-pointer">`).join('')}</div>
                </details>`;
            }

            html += `</div></div>`;
        });
        html += '</div>';

        html += `<div class="text-center pt-4 flex items-center justify-center gap-6"><a href="/dashboard" class="text-primary-400 hover:text-primary-300 text-sm">← Back to Dashboard</a><a href="/test/${testId}/report?print=1" target="_blank" class="text-sm text-gray-400 hover:text-white transition-colors">📥 Download PDF Report</a></div>`;
        container.innerHTML = html;

    } catch (err) {
        container.innerHTML = `<div class="text-center py-20 text-red-400">Failed to load: ${err.message}</div>`;
    }
}

let currentShot = null;
let allShots = [];

function openLightbox(src) {
    allShots = Array.from(document.querySelectorAll('#test-detail img[src]')).map(img => img.src);
    currentShot = allShots.indexOf(src.startsWith('http') ? src : window.location.origin + src);
    if (currentShot === -1) currentShot = 0;
    showShot();
    document.getElementById('lightbox').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    document.getElementById('lightbox').classList.add('hidden');
    document.body.style.overflow = '';
}

function nextShot() { if (allShots.length) { currentShot = (currentShot + 1) % allShots.length; showShot(); } }
function prevShot() { if (allShots.length) { currentShot = (currentShot - 1 + allShots.length) % allShots.length; showShot(); } }

function showShot() {
    document.getElementById('lightbox-img').src = allShots[currentShot];
    document.getElementById('lightbox-count').textContent = `${currentShot + 1} / ${allShots.length}`;
}

document.addEventListener('keydown', (e) => {
    if (document.getElementById('lightbox').classList.contains('hidden')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') nextShot();
    if (e.key === 'ArrowLeft') prevShot();
});

loadTest();

</script>

<div id="lightbox" class="hidden fixed inset-0 z-50 bg-black/95 flex items-center justify-center" onclick="closeLightbox()">
    <button class="absolute top-4 right-4 text-white/60 hover:text-white text-2xl z-10" onclick="closeLightbox()">&times;</button>
    <button class="absolute left-4 top-1/2 -translate-y-1/2 text-white/60 hover:text-white text-3xl z-10 px-2" onclick="event.stopPropagation(); prevShot()">‹</button>
    <button class="absolute right-4 top-1/2 -translate-y-1/2 text-white/60 hover:text-white text-3xl z-10 px-2" onclick="event.stopPropagation(); nextShot()">›</button>
    <span id="lightbox-count" class="absolute bottom-6 left-1/2 -translate-x-1/2 text-white/60 text-sm z-10 bg-black/50 px-3 py-1 rounded-full"></span>
    <img id="lightbox-img" src="" class="max-w-[90vw] max-h-[85vh] object-contain rounded-lg shadow-2xl" onclick="event.stopPropagation()" />
</div>

{% endblock %}
