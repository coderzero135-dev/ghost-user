<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nipX — {% block title %}AI-Powered UX Testing{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen antialiased">
    <nav class="fixed top-0 left-0 right-0 z-50 border-b border-white/5 bg-gray-950/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center group">
                    <img src="/static/logo.svg" alt="nipX" class="h-8 sm:h-9" />
                </a>
                <div class="flex items-center space-x-1">
                    <a href="/" class="px-3 py-2 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 transition-all">Home</a>
                    <a href="/dashboard" class="px-3 py-2 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 transition-all">Dashboard</a>
                    <div id="auth-nav" class="flex items-center space-x-1 ml-2">
                        <a href="/login" class="px-4 py-2 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 transition-all">Log In</a>
                        <a href="/signup" class="px-4 py-2 text-sm font-medium bg-primary-600 hover:bg-primary-500 text-white rounded-lg transition-all shadow-lg shadow-primary-600/20 hover:shadow-primary-500/30">Sign Up</a>
                    </div>
                    <div id="user-nav" class="hidden items-center space-x-3 ml-2">
                        <span id="credit-badge" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-primary-500/10 text-primary-300 border border-primary-500/20"></span>
                        <span id="user-email" class="text-sm text-gray-400 hidden sm:inline"></span>
                        <button id="logout-btn" class="px-3 py-2 text-sm text-gray-500 hover:text-gray-300 rounded-lg hover:bg-white/5 transition-all">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <main class="pt-16">{% block content %}{% endblock %}</main>
    <script src="/static/js/app.js"></script>
    <script>
    (function() {
        const token = localStorage.getItem('token');
        const userData = localStorage.getItem('user');
        if (token && userData) {
            try {
                const user = JSON.parse(userData);
                document.getElementById('auth-nav').classList.add('hidden');
                const un = document.getElementById('user-nav');
                un.classList.remove('hidden');
                un.classList.add('flex');
                document.getElementById('user-email').textContent = user.email;
                document.getElementById('credit-badge').textContent = (user.credits || 0) + ' credits';
            } catch(e) {}
        }
        document.getElementById('logout-btn')?.addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        });
    })();
    </script>
</body>
</html>
