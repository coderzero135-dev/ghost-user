<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .line  { stroke: #6366F1; opacity: 0.25; }
    .ring  { stroke: #6366F1; opacity: 0.10; }
    .ring2 { stroke: #6366F1; opacity: 0.15; }
    .node  { fill: #6366F1; opacity: 0.25; }
    .core  { fill: url(#g); opacity: 0.9; }
    @media (prefers-color-scheme: dark) {
      .line  { stroke: url(#g); opacity: 0.8; }
      .ring  { stroke: url(#g); opacity: 0.3; }
      .ring2 { stroke: url(#g); opacity: 0.4; }
      .node  { fill: url(#g); opacity: 1; }
      .core  { fill: url(#g); }
    }
  </style>

  <path d="M30,30 L30,90" class="line" stroke-width="8" stroke-linecap="round"/>
  <path d="M30,30 L90,90" class="line" stroke-width="8" stroke-linecap="round"/>
  <path d="M90,30 L90,90" class="line" stroke-width="8" stroke-linecap="round"/>

  <circle cx="60" cy="60" r="18" fill="none" class="ring" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="12" fill="none" class="ring2" stroke-width="1"/>
  <circle cx="60" cy="60" r="8" fill="none" class="ring2" stroke-width="1"/>

  <circle cx="30" cy="30" r="10" class="node" filter="url(#glow)"/>
  <circle cx="30" cy="90" r="10" class="node" filter="url(#glow)"/>
  <circle cx="90" cy="30" r="10" class="node" filter="url(#glow)"/>
  <circle cx="90" cy="90" r="10" class="node" filter="url(#glow)"/>

  <circle cx="60" cy="60" r="7" class="core" filter="url(#glow)"/>
</svg>
